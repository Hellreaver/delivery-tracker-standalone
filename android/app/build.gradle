plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }
def signingProps = new Properties()
def signingFile = rootProject.file('signing/signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'local.tower.deliverytracker'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.hellreaver.deliverytracker'
        minSdk 31
        targetSdk 35
        versionCode versionProps['versionCode'].toInteger()
        versionName versionProps['versionName']
        ndk {
            abiFilters 'arm64-v8a'   // every current Pixel; add 'x86_64' to run in the emulator
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('signing/release.jks')
            storePassword signingProps['storePassword']
            keyAlias signingProps['keyAlias']
            keyPassword signingProps['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}

// Runs app.py (copied into src/main/python by build.sh) inside the app.
chaquopy {
    defaultConfig {
        version = '3.12'
        def py = System.getenv('BUILD_PYTHON')
        if (py) buildPython(py)
    }
}
